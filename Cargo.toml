[package]
name = "yuki-video-editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A resource-conscious, AI-ready non-destructive video editor for Linux"
publish = false

[lib]
name = "yuki_video_editor"
path = "src/lib.rs"

[[bin]]
name = "yuki-video-editor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "persistence", "wayland", "wgpu", "x11"] }
egui_dock = { version = "0.21.1", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
